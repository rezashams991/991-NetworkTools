<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Network Tools Test</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    #toolbar { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
    #toolbar button { padding: 0.4rem 0.8rem; cursor: pointer; }
    #toolContainer { border: 1px solid #ccc; padding: 1rem; margin-top: 1rem; border-radius: 8px; min-height: 150px; }
    .converter-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.5rem 0; }
    #result { white-space: pre-wrap; margin-top: 0.5rem; }
    #portResult { margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>🧪 Network Tools</h1>
  <p>Click a button below to test a tool.</p>
  <div id="toolbar">
    <button data-tool="ping">📶 Ping</button>
    <button data-tool="dns">🌐 DNS</button>
    <button data-tool="ipinfo">📍 IP Info</button>
    <button data-tool="whois">📋 WhoIs</button>
    <button data-tool="traceroute">🧭 Traceroute</button>
    <button data-tool="portscan">🔍 Port Scan</button>
  </div>
  <div id="toolContainer"><p style="color:#888;">Select a tool above.</p></div>

  <script type="module">
    const BASE_URL = '/src/index.js';
    const container = document.getElementById('toolContainer');
    const buttons = document.querySelectorAll('[data-tool]');

    async function loadTool(name) {
      container.innerHTML = `<p>⏳ Loading ${name}...</p>`;
      try {
        const mod = await import(BASE_URL);
        const fn = mod[name];
        if (typeof fn !== 'function') throw new Error(`Tool "${name}" not found`);
        container.innerHTML = '';
        fn(container);
      } catch (err) {
        container.innerHTML = `<p style="color:red;">❌ Error: ${err.message}</p>`;
        console.error(err);
      }
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => loadTool(btn.dataset.tool));
    });

    // Auto-load first tool
    loadTool('ping');
  </script>
</body>
</html>
